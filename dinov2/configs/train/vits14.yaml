dino:
  head_n_prototypes: 131072
  head_bottleneck_dim: 384
ibot:
  separate_head: true
  head_n_prototypes: 131072
train:
  batch_size_per_gpu: 8
  accumulation_steps: 128 # 256 --> 2048 batch size
  dataset_path: ImageNet:split=TRAIN
  centering: sinkhorn_knopp
  OFFICIAL_EPOCH_LENGTH: 10
student:
  arch: vit_small
  patch_size: 14
  drop_path_rate: 0.4
  ffn_layer: mlp
  block_chunks: 0
  pretrained_weights: 'https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth' # '' # 'https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth'
teacher:
  momentum_teacher: 0.994
optim:
  epochs: 50
  weight_decay_end: 0.2
  base_lr: 2.0e-04  # learning rate for a batch size of 1024
  warmup_epochs: 10
  layerwise_decay: 1.0
crops:
  local_crops_size: 98
evaluation:
  eval_period_iterations: 100 # every 10 steps (not iterations)
  eval_dataset: ImageNet:split=VAL:root=/workspace/data_gh/imagenet1k:extra=/workspace/data_gh/imagenet1k
  train_fraction: 0.8
block_expansion:
  enabled: True
  expanded_blocks: [3, 7, 11] #[] #[3, 7, 11]
  path_dropout: 0.3